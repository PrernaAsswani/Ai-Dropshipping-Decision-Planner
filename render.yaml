services:
  - type: web
    name: decision-planner-api
    env: node
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm run start:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_URL
        sync: false # Set this in Render dashboard to your Netlify frontend URL (e.g., https://your-app.netlify.app)
      - key: MONGODB_URI
        sync: false # Set this in Render dashboard to your MongoDB Atlas URI
      - key: OPENROUTER_API_KEY
        sync: false # Set this in Render dashboard to your OpenRouter API key

  - type: web
    name: droplify-ml-api
    env: python
    plan: free
    rootDir: ml_api
    buildCommand: pip install --no-cache-dir -r requirements.txt && python train.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: PORT
        value: 5001
